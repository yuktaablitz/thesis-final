# Approach 2 — Cross-Market AI Attention Model
# Only build this after Approach 1 is functioning end-to-end (see README).
# Inherits target/split from approach1.yaml; do not redefine the target here.

extends: approach1.yaml

cross_market:
  symbols: [ETHUSDT, BNBUSDT, SOLUSDT]
  features_per_symbol:
    - return_1h
    - return_3h
    - return_6h
    - return_12h
    - return_24h
    - volatility_24h
    - volume_ratio
    - taker_imbalance
  relative_features:
    - btc_minus_eth_return
    - btc_minus_sol_return
    - eth_btc_relative_return
    - sol_btc_relative_return
    - btc_eth_corr_24h
    - btc_eth_corr_168h
    - btc_sol_corr_24h
    - btc_sol_corr_168h
    - altcoin_average_return
    - altcoin_return_dispersion
    - crypto_market_breadth

news_event_scope:
  btc_specific: [ETF, MINING, WHALE, REGULATION]
  market_wide: [FED, REGULATION_CRYPTO, EXCHANGE_HACK, STABLECOIN, RISK_OFF, INSTITUTIONAL_CRYPTO]

encoders:
  btc: true
  cross_market: true
  derivatives: true
  news: true
  macro: true

attention:
  temporal: true    # TCN -> multi-head self-attention over time
  modality: true    # attention over {btc, derivatives, cross_market, news, macro} branch outputs
  n_heads: 4

compare_variants:
  - name: model_a_concat
    temporal_attention: false
    modality_attention: false
  - name: model_b_temporal_attention
    temporal_attention: true
    modality_attention: false
  - name: model_c_full_attention
    temporal_attention: true
    modality_attention: true
